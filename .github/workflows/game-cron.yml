name: Game Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run queue tick
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/cron/queues"
        env:
          API_URL: ${{ secrets.ETHERIA_API_URL }}
          CRON_SECRET: ${{ secrets.ETHERIA_CRON_SECRET }}

      - name: Run season tick
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/cron/season"
        env:
          API_URL: ${{ secrets.ETHERIA_API_URL }}
          CRON_SECRET: ${{ secrets.ETHERIA_CRON_SECRET }}

      - name: Run barbarian tick
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/cron/barbarians"
        env:
          API_URL: ${{ secrets.ETHERIA_API_URL }}
          CRON_SECRET: ${{ secrets.ETHERIA_CRON_SECRET }}

      - name: Run bot tick
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/cron/bots"
        env:
          API_URL: ${{ secrets.ETHERIA_API_URL }}
          CRON_SECRET: ${{ secrets.ETHERIA_CRON_SECRET }}
