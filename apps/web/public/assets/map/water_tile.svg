<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Seamless-ish ocean tile: layered noise + wave ribbons. -->
    <linearGradient id="g0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08282a"/>
      <stop offset="1" stop-color="#031012"/>
    </linearGradient>
    <pattern id="p_waves" patternUnits="userSpaceOnUse" width="128" height="128">
      <path d="M-16 24 C 8 8, 32 40, 56 24 S 104 40, 144 24" fill="none" stroke="rgba(90,220,214,0.16)" stroke-width="6" stroke-linecap="round"/>
      <path d="M-16 68 C 8 52, 32 84, 56 68 S 104 84, 144 68" fill="none" stroke="rgba(90,220,214,0.11)" stroke-width="4" stroke-linecap="round"/>
      <path d="M-16 104 C 8 88, 32 120, 56 104 S 104 120, 144 104" fill="none" stroke="rgba(210,255,250,0.07)" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="p_speckle" patternUnits="userSpaceOnUse" width="64" height="64">
      <circle cx="8" cy="12" r="1.4" fill="rgba(255,255,255,0.05)"/>
      <circle cx="26" cy="20" r="1.2" fill="rgba(46,199,201,0.05)"/>
      <circle cx="52" cy="10" r="1.0" fill="rgba(255,255,255,0.04)"/>
      <circle cx="40" cy="48" r="1.6" fill="rgba(46,199,201,0.06)"/>
      <circle cx="14" cy="52" r="1.1" fill="rgba(255,255,255,0.04)"/>
      <circle cx="58" cy="58" r="1.3" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#g0)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#p_waves)" opacity="0.9"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#p_waves)" opacity="0.75" transform="translate(64, 48)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#p_speckle)" opacity="1"/>

  <!-- Subtle vignette -->
  <radialGradient id="v" cx="50%" cy="45%" r="70%">
    <stop offset="0" stop-color="rgba(0,0,0,0)"/>
    <stop offset="1" stop-color="rgba(0,0,0,0.35)"/>
  </radialGradient>
  <rect x="0" y="0" width="512" height="512" fill="url(#v)"/>
</svg>

